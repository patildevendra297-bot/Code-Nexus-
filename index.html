async function u5(name){const b=new TextEncoder().encode(name),ns=NS.replace(/-/g,"").match(/../g).map(h=>parseInt(h,16)),a=new Uint8Array(16+b.length);a.set(ns);a.set(b,16);
 const h=new Uint8Array(await crypto.subtle.digest("SHA-1",a)).slice(0,16);h[6]=h[6]&15|80;h[8]=h[8]&63|128;

  .sort((a,b)=>bkey(a.c.branch)-bkey(b.c.branch)||String(a.c.branch).localeCompare(b.c.branch)||YR.indexOf(a.c.year)-YR.indexOf(b.c.year)||a.enrollment.length-b.enrollment.length||a.enrollment.localeCompare(b.enrollment));

const c_=(...x)=>`<div class="card">${x.join("")}</div>`,B=(t,f,k="")=>`<button class="${k}" onclick="${f}">${t}</button>`,rw=(...x)=>`<div class="row">${x.join("")}</div>`,mu=t=>`<p class="mu">${t}</p>`;

const fs=(k,l,o,cb="")=>`<label>${l}</label><select onchange="F['${k}']=this.value;${cb}">${o.map(x=>`<option ${String(F[k])===String(x)?"selected":""}>${x}</option>`).join("")}</select>`;

function cal(map,click){const[y,m]=F.cm||(F.cm=[new Date().getFullYear(),new Date().getMonth()]),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=`<div class="row"><button class="sm" onclick="cmv(-1)">‹</button><b style="text-align:center">${new Date(y,m).toLocaleString("en",{month:"long",year:"numeric"})}</b><button class="sm" onclick="cmv(1)">›</button></div><div class="cal">`+[..."SMTWTFS"].map(d=>`<i>${d}</i>`).join("");
 for(let i=0;i<f;i++)h+="<span></span>";for(let d=1;d<=n;d++){const k=iso(y,m,d);h+=`<span class="${map[k]||""}" ${click?`onclick="${click}('${k}')" style="cursor:pointer"`:""}>${d}</span>`}return h+"</div>"}

// ===== Auth (login / register / forgot) =====
function auth(){const reg=mode==="register",t=F["r.role"]==="teacher";F["r.role"]??="student";
 $("#app").innerHTML=`<div class="wrap"><div style="text-align:center;margin:18px 0"><b style="font-size:30px;color:var(--ac)">Code Nexus</b>${mu("Attendance, tests, notes & fees")}</div>
 <div class="card"><div class="seg"><button class="${!reg?"on":""}" onclick="mode='login';auth()">Login</button><button class="${reg?"on":""}" onclick="mode='register';auth()">New account</button></div>
 ${!reg?fi("l.u","Email or enrollment number")+fi("l.p","Password","password")+B("Login","login()")+B("Forgot password?","forgot()","g")

 ${fi("r.name","First name")+fi("r.sur","Surname (Last name)")+fi("r.email","Email (for login and password reset)","email","name@example.com")+fi("r.mob","Mobile number (10 digit)","tel")}
