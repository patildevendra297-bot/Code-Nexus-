<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5a1c8a">
<meta name="description" content="Code Nexus, JIT Borawan: attendance, online tests, notes and fees.">
<link rel="icon" href="">
<title>Code Nexus</title>
<style>
:root{--bg:#f5f1fb;--card:#fff;--ac:#5a1c8a;--ok:#16a34a;--no:#dc2626;--lv:#d97706;--mu:#6f6a7d;--tx:#14192e;--gr:#ebe4f3;--in:#f3eef9;--bd:#efe8f7;--warnbg:#fee2e2;--okbg:#dcfce7;--sh:0 1px 3px #5a1c8a12,0 4px 14px #5a1c8a0d;color-scheme:light}
[data-theme=dark]{--bg:#0f0a16;--card:#1a1325;--ac:#8f46cf;--ok:#34d399;--no:#f87171;--lv:#fbbf24;--mu:#a99fba;--tx:#f2ecf9;--gr:#2a2038;--in:#231a31;--bd:#2a2038;--warnbg:#3b1620;--okbg:#10301f;--sh:0 1px 3px #0006;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:72px;transition:background .2s}
a{color:inherit;text-decoration:none}
/* header */
header{background:linear-gradient(90deg,#4a1673,#6d2aa6);color:#fff;border-bottom:3px solid #c9962b;position:sticky;top:0;z-index:5}
header .in{max-width:1120px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
header .brand{display:flex;align-items:center;gap:10px;font-size:19px;white-space:nowrap;min-width:0}
header img{width:44px;height:44px;border-radius:50%;background:#fff;padding:1px}
header #pt{display:none;font-size:19px}
header .sp{flex:1}
header button.sm{white-space:nowrap;flex:0 0 auto;width:auto;margin:0;padding:8px 12px;background:rgba(255,255,255,.18);color:#fff;font-size:13px}
/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:14px}
#m{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));column-gap:14px;align-items:start;animation:fade .25s}
#m>.hero,#m>.seg,#m>.bk,#m>#list,#m>.full{grid-column:1/-1}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:12px;align-items:start}
#list>p{grid-column:1/-1}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#4a1673,#8a3fc4);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero small{color:#ede0ff;display:block;margin-top:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
@media(hover:hover){#m>.card:hover{transform:translateY(-2px)}}
.row{display:flex;gap:8px;align-items:center;margin:3px 0}.row>*{flex:1}.row>small{flex:0 0 auto}
h3{font-size:16px;margin-bottom:6px}
.mu{color:var(--mu);font-size:13px;margin:2px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);background:var(--in);border-radius:12px;font-size:15px;margin:3px 0 8px;color:var(--tx);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #8f46cf33}
textarea.code,pre.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;tab-size:2;white-space:pre-wrap}
pre.code{background:var(--in);padding:10px;border-radius:10px;margin:4px 0;overflow-x:auto;word-break:break-word}
label{display:block;font-size:12px;color:var(--mu)}
button{border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;width:100%;margin:3px 0;font-family:inherit;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.98)}
button.g{background:var(--gr);color:var(--tx)}button.ok{background:var(--ok);color:#fff}button.no{background:var(--no);color:#fff}button.w{background:var(--lv);color:#fff}button.t{background:none;color:var(--no)}
button.sm{width:auto;padding:8px 14px}
.card button.sm{background:var(--gr);color:var(--ac)}
button.pa{background:var(--gr);color:var(--tx);padding:10px 4px;text-align:left}
.pa.P{background:var(--ok);color:#fff}.pa.A{background:var(--no);color:#fff}.pa.L{background:var(--lv);color:#fff}.pa.S{background:var(--ac);color:#fff}
.P{color:var(--ok)}.A{color:var(--no)}.L{color:var(--lv)}.b{font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:13px}
.cal i{font-style:normal;color:var(--mu);font-size:11px}.cal span{padding:8px 0;border-radius:8px}
.cal span.P{background:var(--ok);color:#fff}.cal span.A{background:var(--no);color:#fff}.cal span.L{background:var(--lv);color:#fff}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.seg button{width:auto;white-space:nowrap;padding:9px 16px;background:var(--card);color:var(--mu);border:1px solid var(--bd);border-radius:20px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.warn{background:var(--warnbg);color:var(--no);font-weight:600;font-size:14px}
.bar{height:10px;background:var(--gr);border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:5px}
img.qr{max-width:100%;border-radius:12px;display:block;margin:8px auto}
.exp{background:var(--in);border-left:4px solid var(--ac);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--gr);color:var(--ac);margin-right:4px}
/* nav: bottom bar on phones */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:11px;margin:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-size:19px;line-height:1.1}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
nav .dk{display:none}
/* social */
.soc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.soc a{background:var(--gr);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600}
.soc a:hover{background:var(--ac);color:#fff}
/* login */
.auth{min-height:100vh;display:flex;flex-direction:column}
.bp{background:linear-gradient(160deg,#3d1160,#6d2aa6);color:#fff;padding:22px 18px;text-align:center}
.bp img{width:110px;height:110px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 6px 24px #0005}
.bp h1{font-size:28px;margin-top:8px;letter-spacing:.5px}.bp p{opacity:.85}
.bp ul{display:none;list-style:none;padding:0;margin:20px auto 0;text-align:left;max-width:300px;line-height:2}
.bp .soc{justify-content:center}.bp .soc a{background:rgba(255,255,255,.16);color:#fff}
.ap{padding:14px;max-width:480px;width:100%;margin:0 auto}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#14192e;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90%;display:none;z-index:9;white-space:pre-line;box-shadow:0 6px 20px #0006}
#busy{position:fixed;top:0;left:0;right:0;bottom:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:8;color:#fff;font-weight:600;backdrop-filter:blur(2px)}
/* desktop: sidebar layout */
@media(min-width:900px){
 body{padding:0 0 0 250px}
 nav{top:0;bottom:auto;width:250px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 12px;overflow:auto;gap:2px}
 nav .dk{display:block}
 nav .top{text-align:center;margin-bottom:14px}
 nav .top img{width:104px;height:104px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 4px 16px #0003}
 nav .top b{display:block;font-size:19px;margin-top:6px;color:var(--ac)}nav .top span{font-size:12px;color:var(--mu)}
 nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;text-align:left;justify-content:flex-start;color:var(--tx)}
 nav button .ic{font-size:18px}
 nav button.on{background:var(--gr);box-shadow:none;color:var(--ac)}
 nav .soc{margin-top:auto;padding-top:14px}
 header .brand{display:none}header #pt{display:block}
 header .in{max-width:none;padding:12px 24px}
 .wrap{padding:22px 24px}
 #toast{bottom:24px}
 .auth{flex-direction:row}
 .bp{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px}
 .bp img{width:190px;height:190px}.bp h1{font-size:38px}.bp ul{display:block}
 .ap{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:560px;padding:30px}
}
@media(min-width:1500px){#m{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}}
@media(max-width:760px){#m,#list{grid-template-columns:1fr}input,select,textarea{font-size:16px}header .brand b{font-size:17px}}
</style>
</head>
